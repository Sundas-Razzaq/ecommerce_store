{% extends 'seller/seller_base.html' %}

{% block seller_content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete
                    </h4>
                </div>
                <div class="card-body p-4 text-center">
                    <h5>Are you sure you want to delete this product?</h5>
                    <p class="mb-4">"{{ product.title }}" (ID: {{ product.id }})</p>
                    
                    <img src="{{ product.image.url }}" class="img-thumbnail mb-4" style="max-height: 200px;">
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'seller:product_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i>Confirm Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
