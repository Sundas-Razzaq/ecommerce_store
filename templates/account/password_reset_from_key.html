<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}Set_new_Password{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-4">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <h2 class="h3 font-weight-bold">Set New Password</h2>
                        <p class="text-muted">Create a new secure password</p>
                    </div>

                    <!-- Form -->
                    <form method="POST" action="{{ action_url }}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_password1" class="form-label">New Password</label>
                            <input type="password" name="password1" id="id_password1" 
                                   class="form-control py-2" 
                                   placeholder="New Password" 
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="id_password2" class="form-label">Confirm Password</label>
                            <input type="password" name="password2" id="id_password2" 
                                   class="form-control py-2" 
                                   placeholder="Confirm Password" 
                                   required>
                        </div>

                        <button type="submit" name="action" class="btn btn-primary w-100 py-2 mb-3 fw-bold">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
