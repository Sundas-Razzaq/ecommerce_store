<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}Password_reset_done{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-4 text-center">
                    <!-- Header -->
                    <div class="mb-4">
                        <h2 class="h3 font-weight-bold">Check Your Email</h2>
                        <p class="text-muted">We've sent you a password reset link</p>
                    </div>
                    
                    <!-- Content -->
                    <p class="mb-4 small">
                        If you don't receive an email, please check your spam folder.
                    </p>
                    
                    <!-- Button -->
                    <a href="{% url 'account_login' %}" class="btn btn-outline-primary w-100">
                        Return to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
