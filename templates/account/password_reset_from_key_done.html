<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}Password_Changed{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <!-- Success Card -->
            <div class="card shadow">
                <div class="card-body text-center p-4">
                    <!-- Green Check Icon -->
                    <div class="mb-4">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="#28a745">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    
                    <!-- Title and Message -->
                    <h3 class="mb-3">Password Changed</h3>
                    <p class="text-muted mb-4">Your password has been updated successfully.</p>
                    
                    <!-- Login Button -->
                    <a href="{% url 'account_login' %}" class="btn btn-primary btn-block py-2">
                        Continue to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
