<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}login{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-4">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <h2 class="h3 font-weight-bold">Welcome Back</h2>
                        <p class="text-muted">Please sign in to continue</p>
                    </div>

                    <!-- Login Form -->
                    <form method="POST" action="{% url 'account_login' %}">
                        {% csrf_token %}

                        {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Invalid email or password
                        </div>
                        {% endif %}

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="id_login" class="form-label">Username</label>
                            <input type="text" name="login" id="id_login" class="form-control py-2"
                                placeholder="Enter your username" required autofocus>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control py-2"
                                placeholder="Enter your password" required>
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
                            <label class="form-check-label small" for="id_remember">
                                Remember me
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button href="{% url 'account_login' %}" type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-bold">
                            Sign In
                        </button>

                        <!-- Footer Links -->
                        <div class="d-flex justify-content-between small">
                            <a href="{% url 'account_signup' %}" class="text-decoration-none">
                                Create an account
                            </a>
                            <a href="{% url 'account_reset_password' %}" class="text-decoration-none">
                                Forgot password?
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
